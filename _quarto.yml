project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!cpri.qmd"
  resources:
    - CNAME
    - robots.txt

website:
  title: "Brett R. Bessen"
  # Required for Quarto to emit sitemap.xml and canonical <link> tags.
  site-url: https://www.brettbessen.com
  favicon: favicon.svg
  google-analytics: "G-SRPDL0S24K"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: tools.qmd
        text: Tools
      - href: cv.qmd
        text: CV

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    include-in-header: meta.html
    # Use KaTeX, not MathJax. Quarto 1.4's MathJax setup injects a
    # render-blocking <script src> from polyfill.io, which is dead
    # (HTTP 520) and stalls HTML parsing before <body> is created —
    # any page with math hangs. KaTeX loads from jsdelivr instead.
    html-math-method: katex
